syntax = "proto3";
package com.shaunkeys.amnesty.ipc.v1;

service BuilderService {
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  rpc RunCommand(RunCommandRequest) returns (RunCommandResponse);
  rpc InstallCustom(InstallCustomRequest) returns (InstallCustomResponse);
}

message InstallCustomRequest {
  string as_user = 1;
  string package = 2;
  optional string pkgbuild = 10;
}
message InstallCustomResponse {}

message InitializeRequest {
  string rootdir = 1;
}
message InitializeResponse {}

message RunCommandRequest {
  string command = 1;
  repeated string args = 2;
  repeated string env = 3;
  optional string runas = 4;
}
message RunCommandResponse {
  int32 exit_code = 1;
  string output = 2;
}
